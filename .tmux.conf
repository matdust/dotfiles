unbind r
bind r source-file ~/.tmux.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# act like vim
setw -g mode-keys vi

bind-key -r -T prefix       Up              resize-pane -U 5
bind-key -r -T prefix       Down            resize-pane -D 5
bind-key -r -T prefix       Left            resize-pane -L 5
bind-key -r -T prefix       Right           resize-pane -R 5


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g default-terminal "tmux-256color"

set -g @plugin 'tmux-plugins/tpm'

# Your desired plugins
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Last saved environment is automatically restored when tmux is started.
set -g @continuum-restore 'on'

# Gruvbox Material (medium dark) palette
# bg0=#282828 bg1=#32302f bg3=#45403d
# fg1=#ddc7a1 grey1=#928374
# red=#ea6962 orange=#e78a4e yellow=#d8a657
# green=#a9b665 aqua=#89b482 blue=#7daea3 purple=#d3869b

# Status bar (transparent background to match terminal)
set -g status-style 'bg=default,fg=#ddc7a1'
set -g status-left-length 60
set -g status-right-length 100

set -g status-left " #{?client_prefix,#[fg=#ea6962]●,#[fg=#928374]○} #[fg=#a9b665,bold]#S #[fg=#928374,nobold]| "
set -g status-right "#[fg=#7daea3]#{pane_current_path} #[fg=#928374]| #[fg=#d8a657]%a %d %b %H:%M "

# Window status
set -g window-status-separator "#[fg=#928374] | "
set -g window-status-format "#[fg=#928374]#I:#W"
set -g window-status-current-format "#[fg=#e78a4e,bold]#I:#W"

# Pane borders
set -g pane-border-style 'fg=#45403d'
set -g pane-active-border-style 'fg=#a9b665'

# Messages / command prompt
set -g message-style 'bg=#32302f,fg=#e78a4e'
set -g message-command-style 'bg=#32302f,fg=#d8a657'

# Copy mode selection
set -g mode-style 'bg=#45403d,fg=#d8a657'

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Configure Tmux
set -g status-position top
set -g status-justify "absolute-centre"

# Pane margins
set -g pane-border-lines heavy
# set -g pane-spacing 1
#
# # window look and feel
# set -wg automatic-rename on
# set -g automatic-rename-format "Window"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
